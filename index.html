<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f1e3" />
    <meta
      name="description"
      content="Pirotecnia Boom, Salta. Pedí fuegos artificiales con el código de la caja. Lista minorista abierta y lista mayorista con acceso."
    />
    <link rel="icon" type="image/png" href="./marca/logo.png" />
    <title>Pirotecnia Boom - Salta</title>
    <script>
      // Tema antes del primer pintado: claro por defecto, oscuro solo si se eligió.
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("boom-theme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0c0a08" : "#f7f1e3");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
